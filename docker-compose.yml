services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    restart: always
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vroom-network

  backend:
    build: ./backend
    volumes:
      - ./backend/images:/app/images
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - vroom-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    environment:
      - BACKEND_URL=http://backend:8000
      - PORT=80
      - DOLLAR=$
    depends_on:
      - backend
    restart: always
    networks:
      - vroom-network

  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - debug
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@vroomvault.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always
    networks:
      - vroom-network

networks:
  vroom-network:
    driver: bridge
    name: vroom-bridge-v2

volumes:
  postgres_data: